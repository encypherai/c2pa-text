name: c2pa-text

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'go/v*.*.*'
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci_python:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --all-extras --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -c pytest.ini

  ci_typescript:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  ci_rust:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test

  ci_go:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache-dependency-path: go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # Cross-language parity gate: regenerate the shared golden fixtures from the
  # Python reference implementation and fail if anything drifted. Combined with
  # each language suite asserting golden/vectors.json, this enforces that any
  # change to the embedding format ("the spec") keeps all four SDKs byte-identical
  # and that committed fixtures stay in sync with the stable state.
  ci_parity:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'
      - name: Sync python
        working-directory: python
        run: uv sync --all-extras --dev
      - name: Regenerate golden fixtures
        run: uv run --project python python golden/generate.py
      - name: Verify golden fixtures are up to date
        run: |
          if ! git diff --quiet -- golden/; then
            echo "::error::golden/ fixtures are out of date. Run 'python golden/generate.py' and commit the result."
            git --no-pager diff -- golden/
            exit 1
          fi
          echo "golden/ fixtures are in sync."

  security:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
      - name: 'Audit: Python (pip-audit via uv)'
        working-directory: python
        run: uv run --with pip-audit pip-audit --strict --desc --skip-editable

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: 'Audit: TypeScript (npm audit)'
        working-directory: typescript
        run: |
          npm ci
          npm audit --audit-level=high

      - name: 'Audit: Rust (cargo-audit)'
        working-directory: rust
        run: |
          cargo install cargo-audit --quiet
          cargo audit

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum
      - name: 'Audit: Go (govulncheck)'
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync
        run: uv sync --all-extras --dev
      - name: Build
        run: uv run --with build python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    # Tag push publishes; workflow_dispatch lets us (re)publish the current
    # main version via OIDC without moving a release tag.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: npm Trusted Publisher (no NPM_TOKEN secret)
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Use latest npm (OIDC trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Publish to npm (OIDC trusted publishing)
        # OIDC trusted publishing: id-token:write + npm>=11.5.1 + no NODE_AUTH_TOKEN.
        # Requires a matching npm Trusted Publisher (org, repo, workflow file, env).
        run: npm publish --access public

  crates:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  go:
    if: startsWith(github.ref, 'refs/tags/go/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      - name: Verify Go module
        working-directory: go
        run: |
          go mod tidy
          go build ./...
          VERSION="${GITHUB_REF_NAME#go/}"
          echo "Go module published via git tag. Users can install with:"
          echo "  go get github.com/encypherai/c2pa-text/go@${VERSION}"
